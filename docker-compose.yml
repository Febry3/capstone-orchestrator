name: ${COMPOSE_PROJECT_NAME:-eventin_orchestrator}

x-app-common: &app-common
    restart: unless-stopped
    init: true
    env_file:
        - ${BACKEND_ENV_FILE:-./backend.env}
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
    networks:
        - orchestrator

services:
    traefik:
        image: traefik:v3.6
        restart: unless-stopped
        command:
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?TRAEFIK_ACME_EMAIL must be set}
            - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
            - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
            - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./traefik/letsencrypt:/letsencrypt
        networks:
            - orchestrator

    postgres:
        image: postgres:18-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-eventin}
        ports:
            - "${POSTGRES_PORT:-5433}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - orchestrator

    redis:
        image: redis:7.2-alpine
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - orchestrator

    asynqmon:
        image: hibiken/asynqmon:latest
        restart: unless-stopped
        ports:
            - "${ASYNQMON_PORT:-8083}:8080"
        command:
            - "--redis-addr=redis:6379"
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - orchestrator

    api:
        <<: *app-common
        build:
            context: ../capstone-backend
            dockerfile: Dockerfile
            target: api
        ports:
            - "${API_PORT:-8082}:8082"
        labels:
            - traefik.enable=true
            - traefik.http.routers.api.rule=Host(`${API_DOMAIN:?API_DOMAIN must be set}`)
            - traefik.http.routers.api.entrypoints=websecure
            - traefik.http.routers.api.tls=true
            - traefik.http.routers.api.tls.certresolver=letsencrypt
            - traefik.http.services.api.loadbalancer.server.port=8082
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O - http://127.0.0.1:$${APP_PORT}/health > /dev/null 2>&1 || exit 1",
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

    worker:
        <<: *app-common
        build:
            context: ../capstone-backend
            dockerfile: Dockerfile
            target: worker
        stop_grace_period: 20s

    frontend:
        build:
            context: ../Kumpulin_EMS
            dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
            target: ${FRONTEND_BUILD_TARGET:-staging}
            args:
                NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        restart: unless-stopped
        env_file:
            - ${FRONTEND_ENV_FILE:-./frontend.env}
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        labels:
            - traefik.enable=true
            - traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN:?FRONTEND_DOMAIN must be set}`)
            - traefik.http.routers.frontend.entrypoints=websecure
            - traefik.http.routers.frontend.tls=true
            - traefik.http.routers.frontend.tls.certresolver=letsencrypt
            - traefik.http.services.frontend.loadbalancer.server.port=3000
        depends_on:
            api:
                condition: service_healthy
        networks:
            - orchestrator

volumes:
    postgres_data:
    redis_data:

networks:
    orchestrator:
        driver: bridge
